name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q app tests
      - name: Alembic on a fresh database
        env:
          DATABASE_URL: sqlite+aiosqlite:///./data/ci.db
        run: alembic upgrade head
      - name: Tests
        env:
          APP_SECRET_KEY: ci-only-secret-key-not-for-production
        run: pytest -q --tb=short
      - name: No live provider keys committed
        run: |
          if git grep -nE 'sk_[A-Za-z0-9]{32,}' -- . ':!tests' ':!*.md'; then
            echo "Potential live API key committed"; exit 1
          fi
